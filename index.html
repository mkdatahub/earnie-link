<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1F3A" />

  <title>P.V.T. & T. Plas | Link Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./style.css?v=20260731-1" />
</head>

<body>
  <main class="page-shell">
    <section class="profile-card">

      <div class="brand-header">
        <div class="brand-mark">
          <img
            src="/images/W_Edit10.png"
            alt="P.V.T. & T. Plas Logo"
          />
        </div>
      </div>

      <div class="card-body">
        <p class="eyebrow">OFFICIAL LINK HUB</p>

        <h1>P.V.T. & T. PLAS</h1>

        <p class="tagline">
          เลือกช่องทางที่ต้องการติดต่อหรือดูข้อมูลเพิ่มเติม
        </p>

        <div
          id="linkList"
          class="link-list"
          aria-label="ช่องทางติดต่อ"
        ></div>

        <div class="contact-card">
          <div>
            <p class="contact-label">ต้องการสอบถามเพิ่มเติม</p>
            <p class="contact-text">ติดต่อฝ่ายการตลาด P.V.T. & T. Plas</p>
          </div>

          <a
            class="contact-button"
            href="tel:099-614-5651"
            aria-label="โทรติดต่อฝ่ายการตลาด P.V.T. & T. Plas"
          >
            <span class="material-symbols-outlined">call</span>
          </a>
        </div>

        <footer>
          <span>© <span id="currentYear"></span> P.V.T. & T. Plas</span>
          <span class="footer-dot">•</span>
          <span>All rights reserved</span>
        </footer>
      </div>
    </section>
  </main>

  <script src="./script.js?v=20260731-1"></script>
</body>
</html>
