<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3d2e" />

  <title>P.V.T. & t. Plas | Link Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="page-shell">
    <section class="profile-card">
      <div class="brand-mark">
  <img src="/images/Logo-บริษัท(ใช้งานจริง).png" alt="P.V.T. & T. Plas Logo">
</div>

      
<h1>P.V.T. & T. Plas</h1>
<p class="eyebrow">OFFICIAL LINK HUB</p>
      <p class="tagline">
        เลือกช่องทางที่ต้องการติดต่อหรือดูข้อมูลเพิ่มเติม
      </p>

      <div id="linkList" class="link-list" aria-label="ช่องทางติดต่อ"></div>

      <div class="contact-card">
        <div>
          <p class="contact-label">ต้องการสอบถามเพิ่มเติม</p>
          <p class="contact-text">ติดต่อฝ่ายขาย P.V.T. & T. Plas</p>
        </div>

        <a
          class="contact-button"
          href="tel:0000000000"
          aria-label="โทรติดต่อฝ่ายขาย"
        >
          <span class="material-symbols-outlined">call</span>
        </a>
      </div>

      <footer>
        <span>© <span id="currentYear"></span> P.V.T. & T. Plas</span>
        <span class="footer-dot">•</span>
        <span>All rights reserved</span>
      </footer>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
